name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Holo Panels
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Holo Panels
        run: bun install --frozen-lockfile
      - name: Validate the published Holo compatibility line
        run: node scripts/validate-ci-bootstrap.mjs
      - name: Validate Holo Panels
        run: bun run validate
