name: Release compatible Holo-JS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: npm-release
    defaults:
      run:
        working-directory: holo-js
    steps:
      - name: Check out Holo Panels
        uses: actions/checkout@v5
        with:
          path: holo-panels
          persist-credentials: false
      - name: Load Holo-JS compatibility pin
        working-directory: .
        run: cat holo-panels/.github/holo-js.env >> "$GITHUB_ENV"
      - name: Check out compatible Holo-JS
        uses: actions/checkout@v5
        with:
          repository: ${{ env.HOLO_JS_REPOSITORY }}
          ref: ${{ env.HOLO_JS_REF }}
          path: holo-js
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install Holo-JS
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3
      - name: Validate Holo-JS
        run: |
          test "$(node -p "require('./packages/kernel/package.json').version")" = "${HOLO_JS_VERSION}"
          bun run typecheck
          bun run lint
          bun run test
      - name: Publish Holo-JS
        env:
          CI: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release
