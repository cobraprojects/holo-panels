name: Release compatible Holo-JS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOLO_JS_REPOSITORY: cobraprojects/holo-js
  HOLO_JS_REF: f8877ac093672514be59d2cf7fe4431352eaadfe
  HOLO_JS_VERSION: 0.3.12

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: npm-release
    steps:
      - name: Check out compatible Holo-JS
        uses: actions/checkout@v5
        with:
          repository: ${{ env.HOLO_JS_REPOSITORY }}
          ref: ${{ env.HOLO_JS_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install Holo-JS
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3
      - name: Validate Holo-JS
        run: |
          test "$(node -p "require('./packages/kernel/package.json').version")" = "${HOLO_JS_VERSION}"
          bun run typecheck
          bun run lint
          bun run test
      - name: Publish Holo-JS
        env:
          CI: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release
