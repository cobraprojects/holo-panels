name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOLO_JS_REPOSITORY: cobraprojects/holo-js
  HOLO_JS_REF: f8877ac093672514be59d2cf7fe4431352eaadfe
  HOLO_JS_VERSION: 0.3.12
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-release
    steps:
      - name: Check out Holo Panels
        uses: actions/checkout@v5
        with:
          path: holo-panels
          persist-credentials: false
      - name: Check out compatible Holo-JS
        uses: actions/checkout@v5
        with:
          repository: ${{ env.HOLO_JS_REPOSITORY }}
          ref: ${{ env.HOLO_JS_REF }}
          path: holo-js
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Validate the compatibility pin
        working-directory: holo-panels
        run: node scripts/validate-ci-bootstrap.mjs
      - name: Install and build compatible Holo-JS packages
        working-directory: holo-js
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3
          node ../holo-panels/scripts/build-compatible-holo.mjs
      - name: Install Holo Panels
        working-directory: holo-panels
        run: bun install --frozen-lockfile
      - name: Link compatible Holo-JS packages
        working-directory: holo-panels
        run: bun run link:holo
      - name: Publish Holo Panels
        working-directory: holo-panels
        env:
          CI: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release
