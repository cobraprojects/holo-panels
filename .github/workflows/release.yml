name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-release
    steps:
      - name: Check out Holo Panels
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install Holo Panels
        run: bun install --frozen-lockfile
      - name: Validate the published Holo compatibility line
        run: node scripts/validate-ci-bootstrap.mjs
      - name: Publish Holo Panels
        env:
          CI: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release
